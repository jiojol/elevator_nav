<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Go2 · 本机交互仿真</title>
<style>
:root{color-scheme:light;--ink:#182b35;--muted:#65747b;--green:#087f75;--line:#dbe3e6;--orange:#e99821}*{box-sizing:border-box}body{margin:0;background:#f2f5f6;color:var(--ink);font:15px/1.55 system-ui,"Noto Sans CJK SC",sans-serif}header{padding:20px 30px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}header p{margin:3px 0 0;color:var(--muted)}.badge{background:#e4f3ee;color:#09685e;padding:6px 12px;border-radius:20px;font-size:13px}main{max-width:1600px;margin:22px auto;padding:0 24px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #102b3510}.title{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h2{font-size:17px;margin:0}.minor{color:var(--muted);font-size:13px}.video{background:#1f2c36;aspect-ratio:1.6;position:relative;display:flex;align-items:center;justify-content:center;color:#e1e9ed}.video img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.note{padding:12px 20px;color:var(--muted);font-size:13px}.map-wrap{padding:12px 16px;background:#fafcfc}canvas{width:100%;display:block;aspect-ratio:2;touch-action:none;cursor:crosshair;background:#f7fafb;border:1px solid #d6e0e3;border-radius:8px}.legend{display:flex;flex-wrap:wrap;gap:16px;padding:0 20px 12px;color:var(--muted);font-size:12px}.legend b{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}.help{padding:14px 20px;background:#eff7f5;border-top:1px solid #d9ece7}.help strong{display:block;color:#176f64}.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px}button{border:1px solid #c8d6da;background:white;color:var(--ink);border-radius:8px;padding:9px 15px;font:inherit;cursor:pointer}button:hover{background:#eef4f5}.stop{border-color:#d4776c;color:#ad3a2b;background:#fff3f0}.info{grid-column:1/-1;padding:16px 20px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}.status{font-weight:650;color:var(--green);font-size:17px;flex:1}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:16px;font-weight:600}#message{padding:0 20px 16px;min-height:35px;color:#a23b2e}.history{padding:0 20px 16px;max-height:150px;overflow:auto;color:var(--muted);font-size:13px}.history div{padding:5px 0;border-top:1px solid #edf0f1}@media(max-width:1000px){main{grid-template-columns:1fr}.info{grid-column:auto}header{padding:15px 20px}}footer{text-align:center;padding:0 20px 22px;color:var(--muted);font-size:12px}
</style>
<header><div><h1>Go2 · 自主导航测试</h1><p id="intro">选择目标位置，观察规划和避障</p></div><span class="badge">仅本电脑 · 无实机连接</span></header>
<main>
<section class="card"><div class="title"><h2>实时仿真</h2><span class="minor" id="scene">准备场景</span></div><div class="video"><span id="videoHint">正在启动 Go2 仿真…</span><img id="video" alt="实时 Go2 物理仿真画面" hidden></div><div class="note" id="simNote">画面来自当前 MuJoCo 状态，碰撞检测保留。</div></section>
<section class="card"><div class="title"><h2>点选目标</h2><span class="minor" id="cursor">等待地图</span></div><div class="map-wrap"><canvas id="map" width="1200" height="600" aria-label="导航地图，单击选目标，拖动设置朝向"></canvas></div><div class="legend"><span><b style="background:#087f75"></b>实际运动</span><span><b style="background:#e99821"></b>局部规划</span><span><b style="background:#6b94ba"></b>先验全局路线</span><span>■ 绿色先验可通行区</span><span>■ 灰色障碍　■ 红色移动障碍</span></div><div class="help"><strong>在绿色先验区点选目标</strong>按住左键拖动后松开：设置目标和最终朝向。路线只在先验通行区域内搜索，过近障碍的目标会被拒绝。</div><div class="toolbar"><button class="stop" id="stop">停止导航</button><button id="reset">重置场景</button><button id="close">结束测试</button></div><div id="message" role="status"></div><div class="history" id="history"></div></section>
<section class="card info"><div class="status" id="status">正在连接本机仿真…</div><div class="metric"><span>仿真时间</span><strong id="time">—</strong></div><div class="metric"><span>机身位置</span><strong id="position">—</strong></div><div class="metric"><span>当前速度命令</span><strong id="speed">—</strong></div><div class="metric"><span>目标距离</span><strong id="distance">—</strong></div></section>
</main><footer>先验 FREE 图搜索全局路线，SCAN 负责局部避障。实际通行能力仍在验证中。</footer>
<script>
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');let state=null,drag=null,lastFrame=0,closed=false;
const names={straight:'开阔平地',final_yaw:'终点转向',large_obstacle:'大障碍绕行',door_065:'65 cm 门洞',door_055:'55 cm 门洞',dynamic_crossing:'动态横穿',blocking_then_clear:'临时挡路',stairs:'楼梯'};
const pixel=p=>[(p[0]+6)/12*canvas.width,(3-p[1])/6*canvas.height];
function world(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width*12-6,3-(e.clientY-r.top)/r.height*6]}
function poly(points,color,width=3,dash=[]){if(!points||points.length<2)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();points.forEach((p,i)=>{const q=pixel(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke();ctx.setLineDash([])}
function arrow(p,yaw,color){const q=pixel(p),len=35;ctx.save();ctx.translate(...q);ctx.rotate(-yaw);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(len,0);ctx.stroke();ctx.beginPath();ctx.moveTo(len,0);ctx.lineTo(len-12,-7);ctx.lineTo(len-12,7);ctx.closePath();ctx.fill();ctx.restore()}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e5ebed';ctx.fillRect(0,0,canvas.width,canvas.height);
for(let x=-6;x<=6;x++)poly([[x,-3],[x,3]],'#dce5e8',1);for(let y=-3;y<=3;y++)poly([[-6,y],[6,y]],'#dce5e8',1);
if(!state)return;
const isSurface=b=>b.name.startsWith('stair_')||b.name==='landing';
function boxRect(b){const p=pixel([b.center[0]-b.half[0],b.center[1]+b.half[1]]);return [p[0],p[1],b.half[0]*200,b.half[1]*200]}
// Walkable surfaces are underneath the actual FREE mask. Walls stay on top.
ctx.fillStyle='#dbe5e8';for(const b of state.boxes||[])if(isSurface(b))ctx.fillRect(...boxRect(b));
ctx.fillStyle='#d9efdf';for(const p of state.prior_free||[]){const r=state.prior_resolution||.1,q=pixel([p[0]-r/2,p[1]+r/2]);ctx.fillRect(q[0],q[1],r*100+.3,r*100+.3)}
for(const b of state.boxes||[]){const rect=boxRect(b);if(isSurface(b)){ctx.strokeStyle='#829f94';ctx.lineWidth=1.5;ctx.strokeRect(...rect);ctx.fillStyle='#426b5c';ctx.font='18px system-ui';ctx.textAlign='center';const top=b.center[2]+b.half[2];if(b.name==='landing'){ctx.fillText('平台',rect[0]+rect[2]/2,rect[1]+rect[3]/2-12);ctx.fillText(top.toFixed(2)+' m',rect[0]+rect[2]/2,rect[1]+rect[3]/2+15)}else{ctx.save();ctx.translate(rect[0]+rect[2]/2,rect[1]+rect[3]/2);ctx.rotate(-Math.PI/2);ctx.fillText(top.toFixed(2)+' m',0,6);ctx.restore()}}else{ctx.fillStyle='#9cabb3';ctx.fillRect(...rect)}}
ctx.textAlign='start';poly(state.reference,'#6b94ba',3,[8,6]);poly(state.curve,'#e99821',4);poly(state.trail,'#087f75',4);
if(state.dynamic&&Math.abs(state.dynamic[1])<3.5){const p=pixel([state.dynamic[0]-.22,state.dynamic[1]+.22]);ctx.fillStyle='#cf5a4d';ctx.fillRect(p[0],p[1],44,44)}
if(state.body){const p=pixel(state.body);ctx.save();ctx.translate(...p);ctx.rotate(-state.yaw);ctx.fillStyle='#087f75';ctx.fillRect(-35,-17.5,70,35);ctx.restore();arrow(state.body,state.yaw,'#075d55')}
if(state.target)arrow(state.target,state.target_yaw,'#d48a19');if(drag)arrow(drag.start,drag.yaw,'#476dd6')}

async function command(body){const res=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const answer=await res.json();if(!res.ok)throw Error(answer.error||'操作未完成');document.querySelector('#message').textContent=body.action==='goal'?'已发送目标，正在规划…':'';return answer}
canvas.addEventListener('pointerdown',e=>{if(!state?.ready||state.fallen){document.querySelector('#message').textContent='请先等待站稳；失稳后请点击重置';return}const p=world(e);drag={start:p,end:p,yaw:Math.atan2(p[1]-state.body[1],p[0]-state.body[0])};canvas.setPointerCapture(e.pointerId);draw()});
canvas.addEventListener('pointermove',e=>{const p=world(e);document.querySelector('#cursor').textContent=`x ${p[0].toFixed(2)} m · y ${p[1].toFixed(2)} m`;if(drag){drag.end=p;if(Math.hypot(p[0]-drag.start[0],p[1]-drag.start[1])>.08)drag.yaw=Math.atan2(p[1]-drag.start[1],p[0]-drag.start[0]);draw()}});
canvas.addEventListener('pointerup',async e=>{if(!drag)return;const d=drag;drag=null;draw();try{await command({action:'goal',x:d.start[0],y:d.start[1],yaw:d.yaw})}catch(err){document.querySelector('#message').textContent=err.message}});
canvas.addEventListener('pointercancel',()=>{drag=null;draw()});
for(const action of ['stop','reset','close'])document.querySelector('#'+action).onclick=async()=>{try{await command({action});if(action==='close'){closed=true;document.querySelector('#status').textContent='测试已结束'}}catch(err){document.querySelector('#message').textContent=err.message}};
async function refresh(){if(closed)return;try{const res=await fetch('/api/state');if(!res.ok)throw Error();state=await res.json();document.querySelector('#intro').textContent=state.motion==='hover'?'悬浮机身模式 · 验证先验导航与避障':'Go2 步态模式 · 验证动力学运动';document.querySelector('#simNote').textContent=state.motion==='hover'?`机身中心位于支撑面上方 ${Math.round(state.hover_height*100)} cm，按导航命令移动，保留几何碰撞检测。此模式不验证步态。`:'画面来自 Go2 步态动力学状态。外围墙仅在画面中隐藏，碰撞检测仍然保留。';document.querySelector('#status').textContent=state.status;document.querySelector('#scene').textContent=names[state.case]||state.case;document.querySelector('#time').textContent=(state.time||0).toFixed(1)+' s';if(state.body)document.querySelector('#position').textContent=state.body.slice(0,2).map(n=>n.toFixed(2)).join(', ')+' m';if(state.cmd)document.querySelector('#speed').textContent=state.cmd[0].toFixed(2)+' m/s · '+state.cmd[2].toFixed(2)+' rad/s';document.querySelector('#distance').textContent=state.distance==null?'—':state.distance.toFixed(2)+' m';document.querySelector('#history').replaceChildren(...(state.history||[]).slice(-5).reverse().map(h=>{const d=document.createElement('div');d.textContent=h;return d}));if(state.frame_id!==lastFrame){lastFrame=state.frame_id;const image=document.querySelector('#video');image.hidden=false;image.src='/api/frame?t='+lastFrame;document.querySelector('#videoHint').hidden=true}draw()}catch(err){document.querySelector('#status').textContent='正在等待本机仿真连接…'}setTimeout(refresh,120)}refresh();
</script></html>
